<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="380">
  <defs>
    <style>
      .txt { font-family: 'DejaVu Sans', sans-serif; font-size: 11px; fill: #222; text-anchor: middle; }
      .txt-bold { font-weight: bold; }
      .lbl { font-family: 'DejaVu Sans', sans-serif; font-size: 10px; fill: #555; }
      .node-start { fill: #e8f4fd; stroke: #1b4f8a; stroke-width: 2; rx: 18; }
      .node-op { fill: #fdfdfd; stroke: #333; stroke-width: 1.5; rx: 5; }
      .node-on { fill: #ffe3e3; stroke: #d12420; stroke-width: 2; rx: 5; }
      .node-off { fill: #f8f9fa; stroke: #495057; stroke-width: 1.8; rx: 5; }
      .node-dec { fill: #fff3bf; stroke: #f08c00; stroke-width: 1.8; }
      .flow-line { stroke: #1b4f8a; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .flow-back { stroke: #d12420; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arr-red); }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1b4f8a" />
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#d12420" />
    </marker>
  </defs>

  <!-- Border Box -->
  <rect x="5" y="5" width="850" height="370" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>

  <!-- Col 1: Initialization -->
  <rect x="25" y="30" width="170" height="40" class="node-start"/>
  <text x="110" y="55" class="txt txt-bold" fill="#1b4f8a">System Boot &amp; Reset</text>
  <line x1="110" y1="70" x2="110" y2="95" class="flow-line"/>

  <rect x="25" y="95" width="170" height="48" class="node-op"/>
  <text x="110" y="116" class="txt txt-bold">DT_ALIAS(led0)</text>
  <text x="110" y="132" class="txt" fill="#666">Query Pin PA20 &amp; Flags</text>
  <line x1="110" y1="143" x2="110" y2="170" class="flow-line"/>

  <polygon points="110,170 185,205 110,240 35,205" class="node-dec"/>
  <text x="110" y="202" class="txt txt-bold" font-size="10">gpio_is_ready_dt?</text>
  <text x="110" y="217" class="txt" font-size="9" fill="#888">Hardware Check</text>
  <line x1="110" y1="240" x2="110" y2="270" class="flow-line"/>
  <text x="120" y="258" class="lbl" font-weight="bold" fill="#2b8a3e">YES</text>

  <rect x="20" y="270" width="180" height="45" class="node-op"/>
  <text x="110" y="290" class="txt txt-bold">gpio_pin_configure_dt()</text>
  <text x="110" y="305" class="txt" fill="#666">Set OUTPUT_INACTIVE</text>

  <!-- Connect Init to Main Loop -->
  <path d="M 200 292 L 235 292 L 235 50 L 275 50" class="flow-line"/>

  <!-- Col 2: Main Loop Header -->
  <rect x="275" y="30" width="220" height="40" class="node-op" fill="#e7f5ff" stroke="#339af0"/>
  <text x="385" y="55" class="txt txt-bold" fill="#1864ab">Main Loop: while (1)</text>
  <line x1="385" y1="70" x2="385" y2="100" class="flow-line"/>

  <!-- Diamond decision: i < 5 -->
  <polygon points="385,100 470,135 385,170 300,135" class="node-dec" fill="#ffe8cc" stroke="#e8590c"/>
  <text x="385" y="132" class="txt txt-bold">i &lt; 5 Cycles?</text>
  <text x="385" y="146" class="txt" font-size="9" fill="#888">Active Burst Phase</text>

  <!-- Loop Body (YES branch) -->
  <line x1="385" y1="170" x2="385" y2="195" class="flow-line"/>
  <text x="395" y="185" class="lbl" font-weight="bold" fill="#2b8a3e">YES (Burst)</text>

  <!-- Step 1: ON -->
  <rect x="285" y="195" width="200" height="48" class="node-on"/>
  <text x="385" y="215" class="txt txt-bold" fill="#d12420">1. gpio_pin_set_dt(&amp;led, 1)</text>
  <text x="385" y="232" class="txt">LED ON &amp; Sleep 350 ms</text>
  <line x1="385" y1="243" x2="385" y2="268" class="flow-line"/>

  <!-- Step 2: OFF -->
  <rect x="285" y="268" width="200" height="48" class="node-off"/>
  <text x="385" y="288" class="txt txt-bold">2. gpio_pin_set_dt(&amp;led, 0)</text>
  <text x="385" y="305" class="txt">LED OFF &amp; Sleep 450 ms</text>

  <!-- Increment & loop back to diamond -->
  <path d="M 485 292 L 515 292 L 515 135 L 470 135" class="flow-line"/>
  <text x="522" y="220" class="lbl" font-weight="bold">i++</text>

  <!-- Col 3: NO branch from diamond directly to Pause Box -->
  <path d="M 470 135 L 590 135" class="flow-line" stroke="#d9480f"/>
  <text x="530" y="125" class="lbl" font-weight="bold" fill="#d9480f">NO (5 Done)</text>

  <rect x="590" y="105" width="240" height="60" class="node-op" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  <text x="710" y="128" class="txt txt-bold" fill="#c92a2a">3. Quiescent Rest Pause</text>
  <text x="710" y="143" class="txt">gpio_pin_set_dt(&amp;led, 0)</text>
  <text x="710" y="157" class="txt" font-weight="bold" fill="#d12420">k_msleep(1000 ms)</text>

  <!-- Loop back to while(1) -->
  <path d="M 710 165 L 710 345 L 260 345 L 260 50 L 275 50" class="flow-back"/>
  <text x="500" y="340" class="lbl" font-weight="bold" fill="#d12420">Repeat Super-Period (Every 5.0 seconds)</text>
</svg>